# Статический сайт: один HTML-файл, сборка не нужна.
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."

# Главная страница Netlify ищет index.html; у проекта файл Assistant.html —
# отдаём его по корню URL (адрес остаётся /).
[[redirects]]
  from = "/"
  to = "/Assistant.html"
  status = 200

[[redirects]]
  from = "/design-system"
  to = "/Assistant.html"
  status = 200

[[redirects]]
  from = "/design-system/"
  to = "/Assistant.html"
  status = 200

[[redirects]]
  from = "/showcase"
  to = "/Assistant.html"
  status = 200

[[redirects]]
  from = "/showcase/"
  to = "/Assistant.html"
  status = 200

[functions."monitor-homepage"]
  schedule = "*/5 * * * *"

[functions."monitor-heartbeat"]
  # Netlify cron runs in UTC: 06:00 UTC = 09:00 Europe/Moscow.
  schedule = "0 6 * * *"
